name: Daily Movie Scraper

on:
  push:
    branches:
      - main
  schedule:
    
    - cron: '*/10 * * * *'
jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python scraper
        run: python scripts/main.py

      - name: Commit and Push changes
        run: |
          # Set up git config for the bot
          git config --global user.name "sayanpal514-hue"
          git config --global user.email "223531683+sayanpal514-hue@users.noreply.github.com"
          
          # Stage all movie JSON files (category folders + combined)
          git add movies/
          
          # Check if there are any changes to commit
          git commit -m "Automated update: fetched latest YouTube movies" || echo "No changes to commit"
          
          # Push the changes
          git push origin HEAD:main
