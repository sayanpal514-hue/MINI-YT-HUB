name: MINI YT

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: mini-yt
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main.py
        run: python main.py

      - name: Commit and push
        run: |
          git config user.name "sayanpal514-hue"
          git config user.email "223531683+sayanpal514-hue@users.noreply.github.com"

          git add movies/

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Automated update"
          git push origin HEAD:main
